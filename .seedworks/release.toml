schema = 1

[app]
name = "Banana"
slug = "banana"
repo = "SeedWorksLab/Banana"
description = "Meal planning, pantry tracking and deal-aware shopping."

[release]
tag_prefix = "v"
staging_dir = "build/releases"
title = "{name} {version}"
checksums = true

[version]
command = ["node", "scripts/update-version.js", "{version}"]
version_file = "app.json"
version_path = "expo.version"
version_code_path = "expo.android.versionCode"
commit_paths = ["app.json", "src/config/release-info.ts"]

[git]
remote = "origin"
commit_message = "Release {tag} (build {version_code})"
tag_message = "{name} release {tag} (build {version_code})"

[requirements]
tools = ["node", "npm", "npx"]
android_sdk = true
java = true
android_cmake = "3.22.1"
android_ndk = "27.1.12297006"

[build.env]
CI = "1"

[[build.steps]]
name = "Generate native Android project"
run = ["npx", "expo", "prebuild", "--platform", "android", "--no-install", "--clean"]

[[build.steps]]
name = "Restore package.json"
run = ["git", "restore", "package.json"]

[[build.steps]]
name = "Build release APK"
run = ["./gradlew", "assembleRelease", "--no-daemon"]
cwd = "android"

[[build.steps]]
name = "Export web bundle"
run = ["npx", "expo", "export", "--platform", "web"]

[[artifacts]]
path = "android/app/build/outputs/apk/release/app-release.apk"
name = "banana-{version}.apk"
platform = "Android"
purpose = "Android APK signed with the debug keystore, for sideloading."
